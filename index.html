<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Lift With Eeya</title>

  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">
  <meta name="apple-mobile-web-app-title"
        content="Lift With Eeya">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #09090b;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .launch {
      width: min(90%, 420px);
      padding: 30px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(100%, 340px);
      height: auto;
      margin: 0 auto 25px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #d4d4d8;
      font-size: 16px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 12px;
      background: #ec4899;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }

    .small {
      margin-top: 18px;
      color: #a1a1aa;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="launch">

    <img
      src="./logo.png"
      class="logo"
      alt="Lift With Eeya"
    >

    <h1>Lift With Eeya</h1>

    <p class="subtitle">
      Personal Trainer
    </p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbw0T4p3NieKJ11uXO_3iEvJS_SnOJRnxEW38uCWvg13ixTcbPg3q-o8mTr4YaLZ4jirEw/exec"
    >
      Open Lift With Eeya
    </a>

    <div class="small">
      Personal Training System
    </div>

  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>

</body>
</html>
